<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Account</title>
</head>
<body>
<h2>Confirm Your Account</h2>
<p th:if="${message}" th:text="${message}" style="color: blue;"></p>
<p th:if="${param.error == 'invalid_otp'}" style="color: red;">Invalid OTP. Please try again.</p>

<form th:action="@{/confirm-account/verify-otp}" method="post">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" th:value="${email}" readonly/><br/>
    <label for="otp">Enter OTP:</label>
    <input type="text" id="otp" name="otp" required/><br/>
    <button type="submit">Verify OTP</button>
</form>
<p>A new OTP has been sent to your email address.</p>
</body>
</html>
